name: Release

on:
  push:
    tags: [ "*" ]

concurrency:
  group: ${{ github.workflow_ref }}

jobs:
  checks:
    name: Checks
    runs-on: macos-26

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: corretto

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic

      - name: Set up GCP Gradle build cache
        uses: technoir-lab/actions/setup-gcp-gradle-build-cache@v1.1.2

      - name: Set up KMP
        uses: technoir-lab/actions/setup-kotlin-multiplatform@v1.1.2

      - name: Build
        run: make build

  packages:
    name: Packages
    needs: checks
    runs-on: macos-26

    permissions:
      contents: write # Required for creating release
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: corretto

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic

      - name: Set up GCP Gradle build cache
        uses: technoir-lab/actions/setup-gcp-gradle-build-cache@v1.1.2

      - name: Set up KMP
        uses: technoir-lab/actions/setup-kotlin-multiplatform@v1.1.2

      - name: Publish to Maven Central
        env:
          CENTRAL_PORTAL_USER: ${{ secrets.CENTRAL_PORTAL_USER }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal

      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        if: github.ref_type == 'tag'
        with:
          generate_release_notes: true
