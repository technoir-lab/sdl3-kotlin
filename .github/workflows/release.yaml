name: Release

on:
  push:
    tags: [ "*" ]

concurrency:
  group: ${{ github.workflow_ref }}

jobs:
  checks:
    name: Checks
    runs-on: macos-26

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 25
          distribution: corretto

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic

      # Setup Gradle validates every Gradle wrapper JAR in the workspace, so SDL is checked out afterwards:
      # its android-project wrapper JAR is not on Gradle's list of known checksums, and this build never runs it.
      - name: Check out SDL
        run: git submodule update --init --depth 1

      - name: Set up GCP Gradle build cache
        uses: technoir-lab/actions/setup-gcp-gradle-build-cache@v1.2.1

      - name: Set up KMP
        uses: technoir-lab/actions/setup-kotlin-multiplatform@v1.2.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: 15859902
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Build
        run: make build

  packages:
    name: Packages
    needs: checks
    runs-on: macos-26

    permissions:
      contents: write # Required for creating release
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 25
          distribution: corretto

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic

      # Setup Gradle validates every Gradle wrapper JAR in the workspace, so SDL is checked out afterwards:
      # its android-project wrapper JAR is not on Gradle's list of known checksums, and this build never runs it.
      - name: Check out SDL
        run: git submodule update --init --depth 1

      - name: Set up GCP Gradle build cache
        uses: technoir-lab/actions/setup-gcp-gradle-build-cache@v1.2.1

      - name: Set up KMP
        uses: technoir-lab/actions/setup-kotlin-multiplatform@v1.2.1

      - name: Publish to Maven Central
        env:
          CENTRAL_PORTAL_USER: ${{ secrets.CENTRAL_PORTAL_USER }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal

      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        if: github.ref_type == 'tag'
        with:
          generate_release_notes: true
